<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Banner">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b3f" />
      <stop offset="0.55" stop-color="#6a2c70" />
      <stop offset="1" stop-color="#b8547a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f9a826" stop-opacity="0.55" />
      <stop offset="1" stop-color="#f9a826" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#g)" />
  <circle cx="1010" cy="60" r="190" fill="url(#glow)" />
  <circle cx="180" cy="220" r="140" fill="#ffffff" opacity="0.05" />
  <circle cx="980" cy="210" r="80" fill="#ffffff" opacity="0.06" />

