<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registry Website</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Hello, world!</h1>
    <p class="subtitle">A very basic website with some colors, some text, and one button.</p>

    <p id="message" class="message">Nothing has happened yet. Try the button.</p>

    <button id="action" class="action" type="button">Do the thing</button>

    <p class="counter">Button pressed <span id="count">0</span> time(s).</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
