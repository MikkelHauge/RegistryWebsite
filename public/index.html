<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Adgang</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <section id="gate">
      <h1>Velkommen</h1>
      <p class="subtitle">Indtast koden fra din invitation.</p>

      <form id="gate-form" novalidate>
        <label for="code">Adgangskode</label>
        <input id="code" name="code" type="text" autocomplete="off" spellcheck="false"
               autocapitalize="characters" maxlength="9" placeholder="f.eks. K7QM-2X9T" required />

        <button type="submit" class="action">Lås op</button>
        <p id="gate-error" class="error" role="alert"></p>
      </form>
    </section>

    <p id="boot-error" class="error" role="alert"></p>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
